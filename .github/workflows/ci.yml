name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testes
        run: python3 -m unittest discover -s tests
      - name: Validar frontmatter das normas
        run: python3 scripts/validar.py plugins/normas/skills/consultar-normas/normas
      - name: Validar frontmatter dos julgados
        run: |
          test -d julgados || { echo "pasta julgados/ não existe"; exit 1; }
          python3 scripts/validar.py julgados
      - name: Índice em dia (desatualizado = falha)
        run: python3 scripts/indice.py --verificar

  varredura:
    # Fase 4, C19: CPF, RG e caractere de controle nos arquivos alterados do PR, sem a lista
    # privada de termos (ela fica no pre-commit local).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Varredura dos arquivos do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD > "$RUNNER_TEMP/arquivos"
          xargs -0 -r python3 scripts/varrer_pr.py < "$RUNNER_TEMP/arquivos"

  gitleaks:
    runs-on: ubuntu-latest
    # no pull_request, a gitleaks-action lista os commits do PR pela API: sem pull-requests: read,
    # ela falha com "Resource not accessible by integration" (visto na R1 da Fase 4)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
